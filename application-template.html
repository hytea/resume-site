<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrew Hyte | Application Resume</title>
    <meta name="description" content="" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:url" content="" />
    <link rel="canonical" href="" />
    <link rel="icon" href="/andrew-icon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="application-page">
    <a class="visually-hidden-focusable position-fixed top-0 start-0 bg-white p-3" href="#application-content">Skip to content</a>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="/">
          <span class="brand-mark" aria-hidden="true">AH</span>
          <span class="brand-word">
            <span id="application-name"></span>
            <span class="brand-role" id="application-current-title"></span>
          </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#application-nav" aria-controls="application-nav"
          aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="application-nav">
          <ul class="navbar-nav ms-auto" id="application-nav-links">
            <li class="nav-item">
              <a class="btn btn-custom nav-link-button" data-resume-download download>Download Resume</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="hero text-white text-center">
      <div class="glass">
        <h1 id="application-headline"></h1>
        <p class="lead" id="application-intro"></p>
        <a class="btn btn-light rounded-pill mt-4 px-4" data-resume-download download>Download Resume</a>
      </div>
    </header>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-lg-2 bg-light pt-4 d-none d-lg-block side-nav-sticky">
          <nav aria-label="On this page">
            <ul class="nav flex-column side-nav" id="application-side-nav"></ul>
          </nav>
        </aside>
        <main class="col-lg-10 pt-4 mx-auto" id="application-content">
          <section id="bio" class="py-5" aria-labelledby="overview-heading">
            <h2 class="text-center mb-5" id="overview-heading">Overview</h2>
            <div class="row align-items-center">
              <div class="col-md-4">
                <img src="/andrew_in_the_mountains_cropped.png" alt="Andrew Hyte in the mountains"
                  class="img-fluid rounded-circle mb-3 bio-image" loading="lazy" />
              </div>
              <div class="col-md-8">
                <h3 id="application-role"></h3>
                <p id="application-summary"></p>
              </div>
            </div>
          </section>
          <section id="highlights" class="py-5" aria-labelledby="highlights-heading">
            <h2 class="text-center mb-5" id="highlights-heading">Selected Work</h2>
            <div class="application-cards" id="application-highlights"></div>
          </section>
          <section id="portfolio" class="py-5" aria-labelledby="portfolio-heading">
            <h2 class="text-center mb-5" id="portfolio-heading">Portfolio</h2>
            <div class="application-cards" id="application-portfolio"></div>
          </section>
          <section id="resume" class="py-5" aria-labelledby="resume-heading">
            <h2 class="text-center mb-5" id="resume-heading">Resume</h2>
            <h3 class="lead section-title">Skills</h3>
            <div id="skills-section" class="resume-section"></div>
            <h3 class="lead section-title">Experience</h3>
            <div id="experience-section" class="resume-section"></div>
            <div id="application-personal-project">
              <h3 class="lead section-title">Personal Software Factory</h3>
              <p id="personal-project"></p>
            </div>
            <h3 class="lead section-title">Education</h3>
            <div id="education-section" class="resume-section"></div>
          </section>
        </main>
      </div>
    </div>

    <section id="contact" class="py-5" aria-labelledby="contact-heading">
      <div class="container">
        <h2 class="text-center mb-4" id="contact-heading">Let's Connect</h2>
        <div class="primary-contact-buttons" id="application-contact-links"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <p class="m-0"><a href="/">Andrew Hyte</a></p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
